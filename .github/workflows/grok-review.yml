name: grok-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review PR with Grok
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MODEL: grok-4.7
        run: |
          set -euo pipefail

          if [ -z "${XAI_API_KEY:-}" ]; then
            echo "::notice::XAI_API_KEY is not available (fork PRs or unset secret). Skipping review."
            exit 0
          fi

          DIFF=""
          if DIFF="$(gh pr diff "$PR_NUMBER" 2>/tmp/gh-pr-diff.err)"; then
            :
          elif DIFF="$(git diff "${BASE_SHA}...${HEAD_SHA}" 2>/tmp/git-diff.err)"; then
            :
          else
            echo "::error::Failed to get the PR diff with gh pr diff or git diff."
            cat /tmp/gh-pr-diff.err /tmp/git-diff.err >&2 || true
            exit 1
          fi

          if [ -z "$DIFF" ]; then
            echo "::notice::PR diff is empty. Skipping review."
            exit 0
          fi

          MAX_CHARS=60000
          TRUNCATION_NOTE=""
          if [ "${#DIFF}" -gt "$MAX_CHARS" ]; then
            DIFF="${DIFF:0:$MAX_CHARS}"
            TRUNCATION_NOTE="[The diff was truncated to ${MAX_CHARS} characters for this review request.]"
          fi

          USER_PROMPT="$(
            printf 'Review the following pull request diff for this single-file web app.\n'
            if [ -n "$TRUNCATION_NOTE" ]; then
              printf '\n%s\n' "$TRUNCATION_NOTE"
            fi
            printf '\n```diff\n%s\n```\n' "$DIFF"
          )"

          SYSTEM_PROMPT='You are reviewing a pull request for a single-file web app. Write a concise code review covering bugs, security issues, regressions, and suggestions. Be actionable and specific to the diff. Do not invent prices or policies. If the diff is truncated, say so. Do not include secrets or personal names.'

          jq -n \
            --arg model "$MODEL" \
            --arg system "$SYSTEM_PROMPT" \
            --arg user "$USER_PROMPT" \
            '{
              model: $model,
              temperature: 0,
              max_tokens: 4096,
              messages: [
                {role: "system", content: $system},
                {role: "user", content: $user}
              ]
            }' > /tmp/xai-request.json

          HTTP_CODE="$(
            curl -sS -o /tmp/xai-response.json -w '%{http_code}' \
              --connect-timeout 30 \
              --max-time 180 \
              -X POST https://api.x.ai/v1/chat/completions \
              -H "Authorization: Bearer ${XAI_API_KEY}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/xai-request.json
          )"

          if ! [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
            ERROR_MSG="$(jq -r '.error.message // .error // .message // empty' /tmp/xai-response.json 2>/dev/null || true)"
            if [ -z "$ERROR_MSG" ]; then
              ERROR_MSG="$(jq -c . /tmp/xai-response.json 2>/dev/null || echo 'no JSON body')"
            fi
            echo "::error::xAI API request failed with HTTP ${HTTP_CODE}: ${ERROR_MSG}"
            exit 1
          fi

          REVIEW="$(jq -r '.choices[0].message.content // empty' /tmp/xai-response.json)"
          if [ -z "$REVIEW" ]; then
            echo "::error::xAI API returned an empty review."
            jq -c 'del(.choices[0].message.content)' /tmp/xai-response.json >&2 || true
            exit 1
          fi

          {
            printf '## Grok review\n\n'
            printf '%s\n' "$REVIEW"
            if [ -n "$TRUNCATION_NOTE" ]; then
              printf '\n\n_%s_\n' "$TRUNCATION_NOTE"
            fi
          } > /tmp/review-comment.md

          gh pr comment "$PR_NUMBER" --body-file /tmp/review-comment.md
          echo "Posted Grok review comment on PR #${PR_NUMBER} using ${MODEL}."
